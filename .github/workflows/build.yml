name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 2026-09-05: GitHub Actions 自带 cache service 出现 "Our services aren't available right now" 故障，
      # 导致 gradle/actions/setup-gradle@v3 拿不到 Gradle distribution，跑不动 assembleDebug。
      # 改用直接 wget 下载 standalone distribution，绕开 cache service。
      - name: Install Gradle (standalone, bypass GitHub cache service outage)
        run: |
          set -e
          echo "Downloading Gradle 8.9 distribution ..."
          wget -q --show-progress https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          echo "Unpacking ..."
          unzip -q /tmp/gradle.zip -d /tmp/
          sudo mv /tmp/gradle-8.9 /opt/gradle-8.9
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"
          rm /tmp/gradle.zip
          gradle --version

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk